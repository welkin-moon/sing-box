name: PUK adaptive client
on:
  push:
    branches: [puk/adaptive-client]
    paths: ['puk/**', '.github/workflows/puk-client.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  client:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.2'
          cache: false
      - run: go test -race ./... && go vet ./...
        working-directory: puk
      - name: Build clients
        working-directory: puk
        run: |
          mkdir -p dist
          GOOS=windows GOARCH=amd64 go build -trimpath -o dist/puk-windows-amd64.exe ./cmd/puk
          GOOS=linux GOARCH=amd64 go build -trimpath -o dist/puk-linux-amd64 ./cmd/puk
          GOOS=linux GOARCH=arm64 go build -trimpath -o dist/puk-linux-arm64 ./cmd/puk
          GOOS=darwin GOARCH=arm64 go build -trimpath -o dist/puk-macos-arm64 ./cmd/puk
          sha256sum dist/* > dist/SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: puk-clients
          path: puk/dist/
